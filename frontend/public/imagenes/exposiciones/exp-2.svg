<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-label="Materia y Geometría: Diálogos entre Piedra y Acero — Sebastián Duarte &amp; Mateo Villamizar">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#44403c"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <filter id="canvasTex" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#ffffff" surfaceScale="1.2" result="light">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
    </filter>
    <linearGradient id="goldFrame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#8A6516"/>
      <stop offset="100%" stop-color="#5A400C"/>
    </linearGradient>
  </defs>

  <!-- Pared de galería con iluminación cenital -->
  <rect width="900" height="700" fill="#eae5dc"/>
  <radialGradient id="wallSpot" cx="50%" cy="38%" r="65%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
    <stop offset="100%" stop-color="#dcd5c9" stop-opacity="0.95"/>
  </radialGradient>
  <rect width="900" height="700" fill="url(#wallSpot)"/>

  <!-- Marco museográfico exterior -->
  <g filter="url(#shadow)">
    <rect x="65" y="36" width="770" height="554" rx="4" fill="#1b1b1b" stroke="url(#goldFrame)" stroke-width="4"/>
    <!-- Paspartú / Bisel interior -->
    <rect x="85" y="56" width="730" height="514" fill="#f7f4ee" stroke="#d2cabb" stroke-width="2"/>
    <!-- Lienzo principal de la obra -->
    <svg x="105" y="74" width="690" height="478" viewBox="0 0 690 478">
      <rect width="690" height="478" fill="url(#bg)"/>
      
      <rect x="120" y="95" width="180" height="290" fill="#d97706" stroke="#fde68a" stroke-width="3"/>
      <polygon points="440,85 565,385 335,385" fill="#9a3412" stroke="#D4AF37" stroke-width="3"/>
      <circle cx="330" cy="240" r="78" fill="none" stroke="#D4AF37" stroke-width="10"/>
    
      <!-- Firma sutil en esquina del lienzo -->
      <text x="672" y="464" font-family="Georgia, serif" font-size="12" font-style="italic" fill="rgba(255,255,255,0.75)" text-anchor="end">Sebastián Duarte &amp; Mateo Villamizar</text>
    </svg>
  </g>

  <!-- Placa curatorial de museo de ancho completo para que todo el título se vea sin recortes -->
  <g transform="translate(65, 608)">
    <rect width="770" height="72" rx="6" fill="#181818" stroke="#8A6516" stroke-width="2"/>
    <text x="385" y="29" font-family="Georgia, 'Playfair Display', serif" font-size="16" font-weight="bold" fill="#F7F5F0" text-anchor="middle">Materia y Geometría: Diálogos entre Piedra y Acero</text>
    <text x="385" y="53" font-family="'Inter', Arial, sans-serif" font-size="13" fill="#D4AF37" text-anchor="middle">Sebastián Duarte &amp; Mateo Villamizar  ·  Escultura Monumental y Abstracción  ·  PRÓXIMA EXPOSICIÓN · PATIO DE ESCULTURAS</text>
  </g>
</svg>